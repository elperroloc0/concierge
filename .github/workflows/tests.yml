name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    # DEBUG=True lets settings fall back to a dev SECRET_KEY and dev
    # ALLOWED_HOSTS. No DATABASE_URL, so Django uses SQLite. Retell, Stripe,
    # Twilio and email are mocked in the tests, so no real keys are needed.
    env:
      DEBUG: "True"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test
